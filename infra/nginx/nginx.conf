user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
    '"rt":$request_time,"ua":"$http_user_agent"}';
  access_log /var/log/nginx/access.log json;

  sendfile on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 4m;

  # Basic rate limiting at the edge (the app also rate-limits per IP).
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript;

  include /etc/nginx/conf.d/*.conf;
}
