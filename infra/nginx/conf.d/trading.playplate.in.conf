# HTTP-first edge config.
#
# This serves the app on port 80 for ANY host — the bare VPS IP or the domain —
# so the site works immediately after `deploy.sh`, before any DNS or TLS is set
# up. `deploy/init_ssl.sh` upgrades this to HTTPS once a certificate exists
# (it writes conf.d/https.conf and swaps the block below for a redirect).
#
# Upstreams are resolved lazily at request time via Docker's embedded DNS
# (127.0.0.11) rather than at nginx startup. A static `upstream { server ...; }`
# block forces resolution during config parse, so nginx crash-loops with
# "host not found in upstream" if a backend/frontend container isn't resolvable
# the instant nginx boots. Using a `resolver` + a variable in `proxy_pass`
# defers the lookup, so nginx always starts and simply returns 502 until the
# upstream is reachable.

server {
  listen 80 default_server;
  server_name _;

  # Docker's embedded DNS; re-resolve upstreams periodically.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Let's Encrypt HTTP-01 challenge (used by init_ssl.sh).
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Security headers.
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # API -> FastAPI backend (resolved at request time).
  location /api/ {
    limit_req zone=api burst=40 nodelay;
    set $upstream_api backend:8000;
    proxy_pass http://$upstream_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Frontend SPA (resolved at request time).
  location / {
    set $upstream_web frontend:80;
    proxy_pass http://$upstream_web;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
