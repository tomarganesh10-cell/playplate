version: "3.9"

services:
  # ─── PostgreSQL Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smm_db
      POSTGRES_USER: smm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smm_secure_pass_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smm -d smm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smm_network

  # ─── Redis Cache / Queue ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_pass_2024}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_secure_pass_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smm_network

  # ─── MinIO Object Storage ───────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - smm_network

  # ─── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://smm:${POSTGRES_PASSWORD:-smm_secure_pass_2024}@postgres:5432/smm_db
      DATABASE_URL_SYNC: postgresql://smm:${POSTGRES_PASSWORD:-smm_secure_pass_2024}@postgres:5432/smm_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_pass_2024}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - media_uploads:/app/uploads
    networks:
      - smm_network
    labels:
      - "traefik.enable=false"

  # ─── React Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL: /api
    networks:
      - smm_network

  # ─── n8n Workflow Automation ────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n_db
      DB_POSTGRESDB_USER: smm
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-smm_secure_pass_2024}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-n8n_secure_2024}
      N8N_HOST: ${DOMAIN:-social.playplate.in}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${DOMAIN:-social.playplate.in}/n8n/
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      N8N_LOG_LEVEL: info
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
      N8N_METRICS: "true"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/import-workflows
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smm_network

  # ─── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot:ro
      - ssl_certs:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
      - n8n
    networks:
      - smm_network

  # ─── Certbot SSL ────────────────────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_data:/var/www/certbot
      - ssl_certs:/etc/letsencrypt
    command: certonly --webroot -w /var/www/certbot --force-renewal --email ${ADMIN_EMAIL:-admin@playplate.in} -d ${DOMAIN:-social.playplate.in} --agree-tos
    profiles:
      - ssl

volumes:
  postgres_data:
  redis_data:
  minio_data:
  n8n_data:
  media_uploads:
  certbot_data:
  ssl_certs:

networks:
  smm_network:
    driver: bridge
