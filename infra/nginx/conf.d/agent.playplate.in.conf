# agent.playplate.in — PLAYPLATE Psychology Engine agent (HTTP-first).
#
# Name-based vhost that lives alongside the default_server block in
# trading.playplate.in.conf. Requests for agent.playplate.in land here; the bare
# IP and every other host keep hitting the default server. HTTP-first on purpose
# (same as the main site) so it works before DNS/TLS; `deploy/init_ssl.sh`-style
# certbot adds HTTPS once a cert exists for this hostname.

upstream agent_upstream { server agent:8000; }

server {
  listen 80;
  server_name agent.playplate.in;

  # Let's Encrypt HTTP-01 challenge.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Everything proxies to the agent service (it serves both the browser UI at /
  # and the JSON API under /v1 and /health).
  location / {
    proxy_pass http://agent_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;   # Opus replies can take a few seconds
  }
}
