# HTTP-first edge config.
#
# This serves the app on port 80 for ANY host — the bare VPS IP or the domain —
# so the site works immediately after `deploy.sh`, before any DNS or TLS is set
# up. `deploy/init_ssl.sh` upgrades this to HTTPS once a certificate exists
# (it writes conf.d/https.conf and swaps the block below for a redirect).

upstream backend_upstream { server backend:8000; }
upstream frontend_upstream { server frontend:80; }

server {
  listen 80 default_server;
  server_name _;

  # Let's Encrypt HTTP-01 challenge (used by init_ssl.sh).
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Security headers.
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # API -> FastAPI backend.
  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Prometheus scrape endpoint (internal networks only).
  location = /metrics {
    proxy_pass http://backend_upstream/api/metrics;
    allow 172.16.0.0/12;
    allow 127.0.0.1;
    deny all;
  }

  # Frontend SPA.
  location / {
    proxy_pass http://frontend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
