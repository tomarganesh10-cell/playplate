# Edge reverse proxy for trading.playplate.in
# - Port 80 serves the ACME challenge and redirects to HTTPS.
# - Port 443 terminates TLS and proxies to frontend (/) and backend (/api, /metrics).
#
# Before the first certificate is issued, run deploy/init_ssl.sh which uses a
# temporary HTTP-only config. After issuance, this file's 443 block is active.

upstream backend_upstream { server backend:8000; }
upstream frontend_upstream { server frontend:80; }

server {
  listen 80;
  server_name trading.playplate.in;

  # Let's Encrypt HTTP-01 challenge.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Redirect everything else to HTTPS.
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name trading.playplate.in;

  ssl_certificate     /etc/letsencrypt/live/trading.playplate.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/trading.playplate.in/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # Security headers.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # API -> FastAPI backend.
  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Prometheus scrape endpoint (restrict to internal/monitoring network in prod).
  location = /metrics {
    proxy_pass http://backend_upstream/api/metrics;
    allow 172.16.0.0/12;   # docker networks
    allow 127.0.0.1;
    deny all;
  }

  # Frontend SPA.
  location / {
    proxy_pass http://frontend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
